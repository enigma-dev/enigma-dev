edition = "2024";
option features.field_presence = EXPLICIT;
option features.enforce_naming_style = STYLE_LEGACY;
package buffers;

import "game.proto";
import "Settings.proto";

message Empty {
}

message Resource {
  string name = 1;
  bool is_function = 2;
  int32 arg_count_min = 3;
  int32 arg_count_max = 4;
  int32 overload_count = 5;
  int32 is_type_name = 6;
  int32 is_global = 7;
  bool is_end = 8;
  repeated string parameters = 9;
}

message CompileRequest {
  enum CompileMode {
    UNKNOWN = 0;
    RUN = 1;
    DEBUG = 2;
    DESIGN = 3;
    COMPILE = 4;
    REBUILD = 5;
  }

  Game game = 1;
  string name = 2;
  CompileMode mode = 3;
}

message LogMessage {
  enum Severity {
    UNKNOWN = 0;
    FINE = 1;
    INFO = 2;
    WARNING = 3;
    ERROR = 4;
  }
  Severity severity = 1; ///< The severity and nature of the message.
  string message = 2; ///< The message to display to the user in the output.
}

message ProgressMessage {
  float progress = 1; ///< In range 1-100 (you can use 0-1, but take a stance, here)
  string message = 2; ///< The message to display inside of or after the progress bar.
}

message CompileReply {
  repeated LogMessage message = 1; ///< Compilation messages logged since the last update.
  ProgressMessage progress = 2; ///< Current compilation progress.
}

message SyntaxError {
  string message = 1; ///< The text associated with the error.
  int32 line = 2; ///< The line number on which the error occurred.
  int32 position = 3; ///< The column number in the line at which the error occurred.
  int32 absolute_index = 4; ///< The zero-based position in the entire code at which the error occurred.
}

message SetDefinitionsRequest {
  string code = 1;
  string yaml = 2;
}

//NOTE: This request may change available keywords which should be reobtained with GetResources().
message SetCurrentConfigRequest {
  resources.Settings settings = 1; ///< The settings that you want to apply including API (e.g, "Direct3D9" for the graphics system).
}

message SyntaxCheckRequest {
  string code = 1;
  int32 script_count = 2;
  repeated string script_names = 3;
}

message SystemType {
  string name = 1; ///< e.g, ("Graphics", "Platform", or "Extensions")
  repeated SystemInfo subsystems = 2; ///< All of the systems found that are of this type.
}

message SystemInfo {
  string name = 1; ///< The human-readable name of the system. e.g, ("Direct3D 9.0", "DirectSound", or "Windows")
  string id = 2; ///< The internal identifier used by the buildsystems. e.g, ("Direct3D9", "DirectSound", or "Win32")
  string description = 3; ///< A friendly description of the system and what it does.
  string author = 4; ///< Name of the system author or maintainer (e.g, "John Doe")
  string target = 5; ///< The target-platform of the system. Only used by compiler descriptions presently.
  repeated string represents = 6; ///< Is the default for these platforms
  repeated string depends = 7; ///< Will build on these platforms
}
