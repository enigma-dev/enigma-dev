edition = "2024";
option features.field_presence = EXPLICIT;
option features.enforce_naming_style = STYLE_LEGACY;
package buffers.resources;

import "options.proto";
import "google/protobuf/cpp_features.proto";

enum ArgumentKind {
  ARG_EXPRESSION = 0;
  ARG_STRING = 1;
  ARG_BOTH = 2;
  ARG_BOOLEAN = 3;
  ARG_MENU = 4;
  ARG_COLOR = 13;
  ARG_FONTSTRING = 15;
  ARG_SPRITE = 5;
  ARG_SOUND = 6;
  ARG_BACKGROUND = 7;
  ARG_PATH = 8;
  ARG_SCRIPT = 9;
  ARG_OBJECT = 10;
  ARG_ROOM = 11;
  ARG_FONT = 12;
  ARG_TIMELINE = 14;
}

message Argument {
  ArgumentKind kind = 1;
  oneof value {
    string string = 2 [features.(pb.cpp).string_type = STRING];
    string sprite = 3 [features.(pb.cpp).string_type = STRING];
    string sound = 4 [features.(pb.cpp).string_type = STRING];
    string background = 5 [features.(pb.cpp).string_type = STRING];
    string path = 6 [features.(pb.cpp).string_type = STRING];
    string script = 7 [features.(pb.cpp).string_type = STRING];
    string object = 8 [features.(pb.cpp).string_type = STRING];
    string room = 9 [features.(pb.cpp).string_type = STRING];
    string font = 10 [features.(pb.cpp).string_type = STRING];
    string timeline = 11 [features.(pb.cpp).string_type = STRING];
  }
}

enum ActionKind {
  ACT_NORMAL = 0;
  ACT_BEGIN = 1;
  ACT_END = 2;
  ACT_ELSE = 3;
  ACT_EXIT = 4;
  ACT_REPEAT = 5;
  ACT_VARIABLE = 6;
  ACT_CODE = 7;
  ACT_PLACEHOLDER = 8;
  ACT_SEPARATOR = 9;
  ACT_LABEL = 10;
}

enum ActionExecution {
  EXEC_NONE = 0;
  EXEC_FUNCTION = 1;
  EXEC_CODE = 2;
}

message Action {
  int32 libid = 1;
  int32 id = 2;
  ActionKind kind = 3;
  bool use_relative = 4 [(gmx) = "userelative"];
  bool is_question = 5 [(gmx) = "isquestion"];
  bool use_apply_to = 6 [(gmx) = "useapplyto"];
  ActionExecution exe_type = 7 [(gmx) = "exetype"];
  string function_name = 8 [(gmx) = "functionname"];
  string code_string = 9 [(gmx) = "codestring"];
  string who_name = 10 [(gmx) = "whoName", features.(pb.cpp).string_type = STRING];
  bool relative = 11;
  bool is_not = 12 [(gmx) = "isnot"];
  repeated Argument arguments = 13 [(gmx) = "arguments/argument"];
}
