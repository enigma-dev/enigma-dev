edition = "2024";
option features.field_presence = EXPLICIT;
option features.enforce_naming_style = STYLE_LEGACY;
package buffers.resources;

import "options.proto";

message Include {
  int32 id = 2 [(gmx) = "GMX_DEPRECATED"];

  bool exists = 4;
  int32 size = 5;

  enum ExportAction { DONT_EXPORT = 0; EXPORT_TO_TEMPORARY_DIRECTORY = 1; EXPORT_TO_WORKING_DIRECTORY = 2; EXPORT_TO_CUSTOM_DIRECTORY = 3; }

  ExportAction export_action = 6 [(gmx) = "exportAction"];
  string export_directory = 7 [(gmx) = "exportDir"];
  bool overwrite_existing = 8 [(gmx) = "overwrite"];
  bool free_after_export = 9 [(gmx) = "freeData"];
  bool remove_at_game_end = 10 [(gmx) = "removeEnd"];
  bool store = 11;

  string file_name = 12 [(gmx) = "filename", (file_path) = true];
}
