edition = "2024";
option features.field_presence = EXPLICIT;
option features.enforce_naming_style = STYLE_LEGACY;
package buffers.resources;

import "options.proto";

message Sprite {
  int32 id = 1 [(gmx) = "GMX_DEPRECATED"];

  bool preload = 2 [(gmx) = "GMX_DEPRECATED"];
  bool smooth_edges = 3 [(gmx) = "GMX_DEPRECATED"];

  int32 alpha_tolerance = 4 [(gmx) = "coltolerance"];
  bool separate_mask = 5 [(gmx) = "sepmasks"];
  int32 origin_x = 6 [(gmx) = "xorig"];
  int32 origin_y = 7 [(gmx) = "yorigin"];

  enum Shape { PRECISE = 0; RECTANGLE = 1; DISK = 2; DIAMOND = 3; }

  Shape shape = 8 [(gmx) = "colkind"];

  enum BoundingBox { AUTOMATIC = 0; FULL_IMAGE = 1; MANUAL = 2; }

  BoundingBox bbox_mode = 9 [(gmx) = "bboxmode"];

  int32 bbox_left = 10;
  int32 bbox_right = 11;
  int32 bbox_top = 12;
  int32 bbox_bottom = 13;

  int32 type = 14;
  int32 h_tile = 15 [(gmx) = "HTile"];
  int32 v_tile = 16 [(gmx) = "VTile"];
  int32 texture_group = 17 [(gmx) = "TextureGroups/TextureGroup0"];
  bool for3D = 18 [(gmx) = "For3D"];
  uint32 width = 19;
  uint32 height = 20;

  repeated string subimages = 21 [(gmx) = "frames/frame", (file_path) = true, (file_kind) = IMAGE];
}
