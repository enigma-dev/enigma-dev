edition = "2024";
option features.field_presence = EXPLICIT;
option features.enforce_naming_style = STYLE_LEGACY;
package buffers.resources;

import "options.proto";

message GameInformation {
  int32 background_color = 1;
  bool embed_game_window = 2;
  string form_caption = 3;

  int32 left = 4;
  int32 top = 5;
  int32 right = 6;
  int32 bottom = 7;

  bool show_border = 8;
  bool allow_resize = 9;
  bool stay_on_top = 10;
  bool pause_game = 11;

  string text = 12;
}
