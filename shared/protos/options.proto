edition = "2024";
package buffers;

option features.field_presence = EXPLICIT;
option features.enforce_naming_style = STYLE_LEGACY;

enum FileKind {
  UNKNOWN = 0;
  APPLICATION = 1;
  AUDIO = 2;
  FONT = 3;
  IMAGE = 4;
  MODEL = 5;
  TEXT = 6;
  VIDEO = 7;
}

import "google/protobuf/descriptor.proto";
extend google.protobuf.FieldOptions {
  int32 id_start = 50000;
  bool file_path = 50001;
  string resource_ref = 50002;
  string gmx = 50003;
  string gmx_id = 50004;
  string yyp = 50005;
  string yyp_id = 50006;
  // When file_path is true, this is the type of file indicated.
  FileKind file_kind = 50007;
  string default_value = 50008;
}
