edition = "2024";
package buffers.resources;

import "options.proto";
import "google/protobuf/cpp_features.proto";

message Timeline {
  message Moment {
    int32 step = 1;
    string code = 2 [(gmx) = "event/action"];
  }

  int32 id = 1 [(gmx) = "GMX_DEPRECATED"];

  repeated Moment moments = 2 [(gmx) = "entry"];
}
