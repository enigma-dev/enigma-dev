edition = "2024";
option features.field_presence = EXPLICIT;
option features.enforce_naming_style = STYLE_LEGACY;
package buffers.resources;

import "options.proto";
import "google/protobuf/cpp_features.proto";

message Object {
  message EgmEvent {  // RM = Rename me.
    string id = 1;
    repeated string arguments = 2;
    string code = 3;
  }
  message LegacyEvent {
    int32 type = 1 [(gmx) = "eventtype"];
    oneof reference {
      int32 number = 2 [(gmx) = "enumb"];
      string name = 3 [(gmx) = "ename", (yyp_id) = "collisionObjectId"];
    }
    string code = 4 [(gmx) = "action", features.(pb.cpp).string_type = STRING];
  }

  enum PhysicsShape { CIRCLE = 0; BOX = 1; SHAPE = 2; }

  message PhysicsShapePoint {
    int32 x = 1 [(gmx) = "GMX_SPLIT/0"];
    int32 y = 2 [(gmx) = "GMX_SPLIT/1"];
  }

  message ObjectPhysicsSettings {
    bool use_physics = 1 [(gmx) = "PhysicsObject", (yyp) = "physicsObject"];
    bool phy_sensor = 2 [(gmx) = "PhysicsObjectSensor", (yyp) = "physicsSensor"];
    PhysicsShape phy_shape_type = 3 [(gmx) = "PhysicsObjectShape", (yyp) = "physicsShape"];
    double phy_density = 4 [(gmx) = "PhysicsObjectDensity", (yyp) = "physicsDensity"];
    double phy_restitution = 5 [(gmx) = "PhysicsObjectRestitution", (yyp) = "physicsRestitution"];
    int32 phy_group = 6 [(gmx) = "PhysicsObjectGroup", (yyp) = "physicsGroup"];
    double phy_linear_damping = 7 [(gmx) = "PhysicsObjectLinearDamping", (yyp) = "physicsLinearDamping"];
    double phy_angular_damping = 8 [(gmx) = "PhysicsObjectAngularDamping", (yyp) = "physicsAngularDamping"];
    double phy_friction = 9 [(gmx) = "PhysicsObjectFriction", (yyp) = "physicsFriction"];
    bool phy_awake = 10 [(gmx) = "PhysicsObjectAwake", (yyp) = "physicsAwake"];
    bool phy_kinematic = 11 [(gmx) = "PhysicsObjectKinematic", (yyp) = "physicsKinematic"];
    repeated PhysicsShapePoint phy_shape = 12 [(gmx) = "PhysicsShapePoints/point", (yyp) = "physicsShapePoints"];
  }

  int32 id = 2 [(gmx) = "GMX_DEPRECATED"];

  string parent_name = 3 [(resource_ref)="object", (gmx) = "parentName", (yyp_id) = "parentObjectId", features.(pb.cpp).string_type = STRING];
  string sprite_name = 4 [(resource_ref)="sprite", (gmx) = "spriteName", (yyp_id) = "spriteId", features.(pb.cpp).string_type = STRING];
  string mask_name = 5 [(resource_ref)="sprite", (gmx) = "maskName", (yyp_id) = "maskSpriteId", features.(pb.cpp).string_type = STRING];

  int32 depth = 6 [(yyp) = "YYP_DEPRECATED"];
  bool solid = 7;
  bool visible = 8;
  bool persistent = 9;

  repeated LegacyEvent legacy_events = 10 [(gmx) = "events/event", (yyp) = "eventList"];
  repeated EgmEvent egm_events = 12;

  ObjectPhysicsSettings physics_settings = 11 [(gmx) = "EGM_NESTED"];
}
