edition = "2024";
option features.field_presence = EXPLICIT;
option features.enforce_naming_style = STYLE_LEGACY;
package buffers.resources;

import "options.proto";

message Background {
int32 id = 1 [(gmx) = "GMX_DEPRECATED"];

bool preload = 2 [(gmx) = "GMX_DEPRECATED"];
bool smooth_edges = 3 [(gmx) = "GMX_DEPRECATED"];

bool use_as_tileset = 4 [(gmx) = "istileset"];

int32 tile_width         = 5 [(gmx) = "tilewidth"];
int32 tile_height        = 6 [(gmx) = "tileheight"];
int32 horizontal_offset  = 7 [(gmx) = "tilexoff"];
int32 vertical_offset    = 8 [(gmx) = "tileyoff"];
int32 horizontal_spacing = 9 [(gmx) = "tilehsep"];
int32 vertical_spacing   = 10 [(gmx) = "tilevsep"];

int32 h_tile = 11 [(gmx) = "HTile"];
int32 v_tile = 12 [(gmx) = "VTile"];
int32 texture_group = 13 [(gmx) = "TextureGroups/TextureGroup0"];
bool for3D = 14 [(gmx) = "For3D"];
uint32 width = 15;
uint32 height = 16;

string image = 17 [(gmx) = "data", (file_path) = true, (file_kind) = IMAGE];
}
